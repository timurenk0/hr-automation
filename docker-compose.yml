services: 
  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend: 
    build: ./backend
    ports: 
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app


  db: 
    image: postgres:17-alpine
    env_file:
      - .env
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes: 
  frontend_node_modules:
  postgres_data:
